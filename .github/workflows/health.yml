# Watches the system when nobody is changing it.
#
# Every other workflow here is triggered by a commit, so nothing notices decay: an
# expired certificate, DNS moving, a deploy that quietly stopped happening, a gate that
# has gone stale. This runs on a schedule against the LIVE site, plus the full local
# suite, so rot surfaces without anyone opening a pull request.
name: Health

on:
  schedule:
    # Mondays, 07:00 UTC. Weekly is enough for a site that changes a few times a month.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live:
    name: live site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the deployed site
        run: python3 scripts/check-live.py

  suite:
    name: suite still current
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.8
    steps:
      - uses: actions/checkout@v5
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      # Deliberately NOT cached: a scheduled run is the one place a cold build is worth
      # having, because it proves the site still builds from nothing.
      - name: Full gates from a cold start
        run: make check
      - name: Visual regression
        run: make visual
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: health-visual-diffs
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
